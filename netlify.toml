# Build settings committed to the repo so ANY Netlify import runs the real
# Next.js build. The explicit plugin reference forces Netlify's OpenNext
# adapter to run (it provisions the serverless functions + publish dir for
# the app routes) — without it, Netlify can publish the raw source and 404
# on every route.
[build]
  command = "npm run build"
  # The Netlify Next.js runtime rejects a publish dir equal to the repo root
  # (the new site's dashboard had it set to "/", which failed the build).
  # netlify.toml overrides the dashboard setting; the plugin rewrites this
  # to its own publish dir during the build anyway.
  publish = ".next"

  [build.environment]
    # NEXT_PUBLIC_* values are intentionally inlined into the JS bundles by
    # Next.js (the Supabase project URL is public by design), so Netlify's
    # secret scanner would otherwise fail every build as a false positive.
    SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
