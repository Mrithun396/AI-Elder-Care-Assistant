# Build settings committed to the repo so ANY Netlify import runs the real
# Next.js build. The explicit plugin reference forces Netlify's OpenNext
# adapter to run (it provisions the serverless functions + publish dir for
# the app routes) — without it, Netlify can publish the raw source and 404
# on every route.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"
